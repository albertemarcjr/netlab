[project]
name = "netlab"
version = "0.1.0"
description = "A learning workspace: code foundations taught through networking"
readme = "README.md"
authors = [
    { name = "Albert Marc", email = "albertemarcjr@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "pandas>=3.1.1",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
    "pytest>=9.2.0",
]
